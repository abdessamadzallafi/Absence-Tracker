name: absence_tracker
description: Absence Tracker ENIAD - Clean Architecture + SQLite
publish_to: 'none'

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # SQLite
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4

  # UI / charts
  fl_chart: ^0.69.0
  intl: ^0.19.0

  # Export
  csv: ^6.0.0
  share_plus: ^10.1.2

  # PDF export (optionnel)
  pdf: ^3.11.1
  printing: ^5.13.4

  # Animations helpers
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
